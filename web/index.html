<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'"
    />
    <title>dashboard</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <div class="brand"><span class="dot"></span> niti</div>
      <div class="goal" id="goal">waiting for a task…</div>
      <div class="conn" id="conn">connecting…</div>
    </header>

    <div class="promptbar">
      <input id="prompt-input" type="text" placeholder="give the team a new goal…" />
      <button id="prompt-send">Send</button>
      <span class="status" id="prompt-status"></span>
    </div>

    <main>
      <section class="graph">
        <canvas id="canvas"></canvas>
        <div class="legend" id="legend"></div>
      </section>

      <aside class="panel">
        <nav class="tabs">
          <button data-tab="tasks" class="active">Tasks</button>
          <button data-tab="messages">Messages</button>
          <button data-tab="usage">Usage</button>
        </nav>
        <div class="tab" id="tab-tasks"></div>
        <div class="tab hidden" id="tab-messages"></div>
        <div class="tab hidden" id="tab-usage"></div>
      </aside>

      <aside class="agent-panel hidden" id="agent-panel">
        <div class="ap-head">
          <span id="ap-title"></span>
          <button id="ap-close" title="close">×</button>
        </div>
        <div class="ap-row">
          <input id="ap-model-input" type="text" placeholder="provider/model" />
          <button id="ap-model-apply">Switch</button>
        </div>
        <div class="ap-row status" id="ap-model-status"></div>
        <div class="ap-log" id="ap-log"></div>
        <div class="ap-row">
          <input id="ap-msg-input" type="text" placeholder="message this agent mid-task…" disabled />
          <button id="ap-msg-send" disabled>Send</button>
        </div>
        <div class="ap-row status" id="ap-msg-status"></div>
      </aside>
    </main>

    <div class="overlay hidden" id="approval-overlay">
      <div class="overlay-box">
        <div class="overlay-head" id="approval-head"></div>
        <div class="diff" id="approval-diff"></div>
        <div class="overlay-actions">
          <button id="approval-yes">Yes</button>
          <button id="approval-always">Always</button>
          <button id="approval-no">No</button>
        </div>
      </div>
    </div>

    <script src="/avatar.js"></script>
    <script src="/app.js"></script>
    <script src="/theme.js"></script>
  </body>
</html>
