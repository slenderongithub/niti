<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'"
    />
    <title>graph</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      :root {
        --bg: #0b0d14; --bg2: #0d0f16; --panel: rgba(21,24,35,0.82); --panel-solid: #151823;
        --ink: #e7e9f2; --muted: #8b90a6; --line: #262b3d;
        --violet: #a78bfa; --green: #4ade80; --red: #f87171; --amber: #fbbf24; --blue: #60a5fa; --pink: #f472b6;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body {
        font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        background: radial-gradient(1200px 800px at 60% 35%, #12151f 0%, var(--bg) 70%);
        color: var(--ink); touch-action: none; -webkit-user-select: none; user-select: none;
      }
      #gcanvas { position: fixed; inset: 0; display: block; }

      /* floating panels */
      .panel {
        position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 8px 30px rgba(0,0,0,0.35);
      }
      #topbar { top: 14px; left: 14px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
      .brand { font-weight: 700; letter-spacing: 0.3px; }
      .brand .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--violet); margin-right: 6px; box-shadow: 0 0 10px var(--violet); }
      #conn { color: var(--muted); font-size: 12px; }
      #conn.live { color: var(--green); }
      #conn.dead { color: var(--amber); }

      #controls { top: 14px; right: 14px; width: 250px; max-height: calc(100vh - 28px); overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
      .seg { display: flex; background: var(--bg2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
      .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 7px 8px; border-radius: 6px; cursor: pointer; font: inherit; font-weight: 600; transition: all .15s; }
      .seg button.active { background: var(--violet); color: #0b0d14; }
      .search { display: flex; align-items: center; gap: 6px; background: var(--bg2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; }
      .search input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--ink); font: inherit; }
      .search .ico { color: var(--muted); }
      .row { display: flex; gap: 8px; }
      .btn { flex: 1; background: var(--bg2); border: 1px solid var(--line); color: var(--ink); border-radius: 9px; padding: 7px; cursor: pointer; font: inherit; transition: all .15s; }
      .btn:hover { border-color: var(--violet); color: var(--violet); }
      .sliders { display: flex; flex-direction: column; gap: 9px; padding-top: 2px; }
      .slider label { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-bottom: 3px; }
      .slider input[type=range] { width: 100%; accent-color: var(--violet); }
      .toggle { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
      .toggle input { accent-color: var(--violet); }
      .hint { color: var(--muted); font-size: 11px; line-height: 1.7; }
      .hint kbd { background: var(--bg2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--ink); }

      #legend { bottom: 14px; left: 14px; padding: 10px 12px; max-width: 42vw; display: flex; flex-wrap: wrap; gap: 6px 14px; }
      #legend .k { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
      #legend .k i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
      #legend .title { width: 100%; color: var(--ink); font-weight: 600; margin-bottom: 2px; }

      #stat { bottom: 14px; right: 14px; padding: 8px 12px; color: var(--muted); font-size: 12px; }
      #stat b { color: var(--ink); }

      #tip { position: fixed; pointer-events: none; z-index: 5; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); opacity: 0; transition: opacity .12s; max-width: 320px; }
      #tip.show { opacity: 1; }
      #tip .t { font-weight: 700; }
      #tip .s { color: var(--muted); }

      @media (max-width: 640px) {
        #controls { width: 210px; }
        #legend { max-width: 60vw; }
      }
    </style>
  </head>
  <body>
    <canvas id="gcanvas"></canvas>

    <div id="topbar" class="panel">
      <div class="brand"><span class="dot"></span>niti · graph</div>
      <div id="conn">loading…</div>
    </div>

    <div id="controls" class="panel">
      <div class="seg" id="mode">
        <button data-mode="project" class="active">Project</button>
        <button data-mode="models">Models</button>
      </div>
      <div class="search">
        <span class="ico">⌕</span>
        <input id="search" placeholder="search nodes…  ( / )" autocomplete="off" spellcheck="false" />
      </div>
      <div class="row">
        <button class="btn" id="fit">Fit&nbsp;(f)</button>
        <button class="btn" id="reset">Re-center</button>
      </div>
      <div class="sliders">
        <div class="slider"><label>link distance <span id="v-link">42</span></label><input id="s-link" type="range" min="16" max="140" value="42" /></div>
        <div class="slider"><label>repulsion <span id="v-charge">30</span></label><input id="s-charge" type="range" min="4" max="120" value="30" /></div>
        <div class="slider"><label>gravity <span id="v-grav">6</span></label><input id="s-grav" type="range" min="0" max="30" value="6" /></div>
      </div>
      <label class="toggle"><span>labels</span><input id="t-labels" type="checkbox" checked /></label>
      <div class="hint">
        drag pins a node · <kbd>dbl-click</kbd> unpins · scroll zoom · flick to coast · click the mini-map to jump<br />
        <kbd>1</kbd>/<kbd>2</kbd> mode · <kbd>/</kbd> search · <kbd>f</kbd> fit · <kbd>esc</kbd> clear
      </div>
    </div>

    <div id="legend" class="panel"></div>
    <div id="stat" class="panel"></div>
    <div id="tip"></div>

    <script src="/avatar.js"></script>
    <script src="/graph.js"></script>
    <script src="/theme.js"></script>
  </body>
</html>
