<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'"
    />
    <title>niti · graph</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
    <style>
      /* Shared look (tokens, .box, .btn, .field, .chip, kbd) comes from style.css — the same
         TUI-style panels the dashboard uses. Only what's specific to a full-screen canvas is here. */
      body { display: block; touch-action: none; -webkit-user-select: none; user-select: none; }
      #gcanvas { position: fixed; inset: 0; display: block; }
      .gbox { position: fixed; margin: 0; }

      #topbar { position: fixed; top: 10px; left: 14px; display: flex; align-items: center; gap: 12px; padding: 0; }

      #controls { top: 18px; right: 14px; width: 260px; max-height: calc(100vh - 36px); overflow: visible; display: flex; flex-direction: column; gap: 12px; padding-top: 14px; }
      #mode { display: flex; gap: 18px; border-bottom: 1px solid var(--line); }
      #mode button { background: none; border: 0; color: var(--muted); padding: 2px 0 6px; cursor: pointer; }
      #mode button.active { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px var(--violet); }
      #search { width: 100%; }
      .row { display: flex; gap: 8px; }
      .row .btn { flex: 1; }
      .sliders { display: flex; flex-direction: column; gap: 8px; }
      .slider label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
      .slider label span { color: var(--ink); }
      .slider input[type=range] { width: 100%; accent-color: var(--violet); }
      .toggle { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
      .toggle input { accent-color: var(--violet); }
      .hint { color: var(--muted); font-size: 12px; line-height: 1.8; }

      #legend-box { bottom: 18px; left: 14px; max-width: 44vw; padding-top: 14px; }
      #legend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
      #legend .k { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
      #legend .k i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      #legend-box:has(#legend:empty) { display: none; } /* nothing to explain yet — no empty frame */

      #stat-box { bottom: 18px; right: 14px; padding-top: 12px; }
      #stat { color: var(--muted); font-size: 12px; }
      #stat b { color: var(--ink); }

      #tip { position: fixed; pointer-events: none; z-index: 5; background: var(--bg); border: 1px solid var(--violet); border-radius: 4px; padding: 6px 10px; font-size: 12px; opacity: 0; transition: opacity .12s; max-width: 320px; }
      #tip.show { opacity: 1; }
      #tip .t { font-weight: 700; }
      #tip .s { color: var(--muted); }

      @media (max-width: 640px) {
        #controls { width: 210px; }
        #legend-box { max-width: 60vw; }
      }
    </style>
  </head>
  <body>
    <canvas id="gcanvas"></canvas>

    <header id="topbar">
      <div class="brand">niti <span class="sub">graph</span></div>
      <span class="chip conn" id="conn">loading…</span>
      <div class="theme-wrap">
        <button class="btn" id="theme-btn"><span id="theme-dot"></span>theme</button>
        <div id="theme-menu" class="hidden" style="left: 0; right: auto"></div>
      </div>
    </header>

    <div id="controls" class="box gbox">
      <span class="box-title">Controls</span>
      <nav id="mode">
        <button data-mode="project" class="active">Project</button>
        <button data-mode="models">Models</button>
      </nav>
      <input class="field" id="search" placeholder="search nodes…" autocomplete="off" spellcheck="false" />
      <div class="row">
        <button class="btn" id="fit">Fit</button>
        <button class="btn" id="reset">Re-center</button>
      </div>
      <div class="sliders">
        <div class="slider"><label>link distance <span id="v-link">42</span></label><input id="s-link" type="range" min="16" max="140" value="42" /></div>
        <div class="slider"><label>repulsion <span id="v-charge">30</span></label><input id="s-charge" type="range" min="4" max="120" value="30" /></div>
        <div class="slider"><label>gravity <span id="v-grav">6</span></label><input id="s-grav" type="range" min="0" max="30" value="6" /></div>
      </div>
      <label class="toggle"><span>labels</span><input id="t-labels" type="checkbox" checked /></label>
      <div class="hint">
        <kbd>1</kbd> <kbd>2</kbd> mode · <kbd>/</kbd> search · <kbd>f</kbd> fit · <kbd>esc</kbd> clear<br />
        <kbd>drag</kbd> pins · <kbd>dbl-click</kbd> unpins · <kbd>scroll</kbd> zoom
      </div>
    </div>

    <div id="legend-box" class="box gbox title-left">
      <span class="box-title" id="legend-title">Legend</span>
      <div id="legend"></div>
    </div>
    <div id="stat-box" class="box gbox">
      <span class="box-title">Graph</span>
      <div id="stat"></div>
    </div>
    <div id="tip"></div>

    <script src="/avatar.js"></script>
    <script src="/graph.js"></script>
    <script src="/theme.js"></script>
  </body>
</html>
