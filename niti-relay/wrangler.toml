# The niti relay on Cloudflare. Setup (once):
#   npx wrangler d1 create niti-relay        → put the id below
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put EXPO_ACCESS_TOKEN  (optional until Expo's enhanced push security is on)
#   npx wrangler deploy
name = "niti-relay"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

[vars]
MAIL_FROM = "niti <login@example.com>"

[[d1_databases]]
binding = "DB"
database_name = "niti-relay"
database_id = "REPLACE-WITH-YOUR-D1-ID"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "AccountRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountRoom"]

# 60 requests a minute per IP across sign-in and connects.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
