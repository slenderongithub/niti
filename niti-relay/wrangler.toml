# The niti relay on Cloudflare's free plan. Setup (once):
#   npx wrangler login
#   npx wrangler d1 create niti-relay        → put the id below
#   npx wrangler deploy
# Optional: npx wrangler secret put EXPO_ACCESS_TOKEN, once Expo's enhanced push security is on.
name = "niti-relay"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "niti-relay"
database_id = "8e44b8cc-8cf7-4afd-8054-05675a4da3f3"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "AccountRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountRoom"]

# 60 requests a minute per IP across sign-in and connects.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
