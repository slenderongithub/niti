# Copy to .niti/agents.yaml and edit, or just run `niti` (the team picker writes this file for you)
# and `niti-core init` for the headless equivalent. Only `agents:` is required — everything below it
# has a working default.

agents:
  - id: architect
    provider: anthropic
    model: claude-opus-4-8
    role: Architect
    lead: true # the lead plans the goal into a task DAG and integrates at the end
    systemPrompt: You are a software architect. Decompose work into independent subtasks.
    allowedTools: [read_file]

  - id: engineer
    provider: openai
    model: gpt-4o
    role: Backend Engineer
    systemPrompt: You are a backend engineer. Implement the assigned task.
    # `mcp` grants every configured MCP server's tools; list a single mcp__server__tool to
    # narrow it. Without it, MCP tools are not offered to this agent at all.
    allowedTools: [read_file, write_file, edit, shell, mcp]
    # reasoning: auto  # off | low | medium | high | auto — Gemini thinkingBudget / OpenAI
                       # reasoning_effort. Unset sends nothing; Flash and Flash-Lite think only
                       # when this is set.
    reviewer: qa # qa must answer "VERDICT: approve" before this agent's tasks are accepted

  - id: qa
    provider: google
    model: gemini-flash-latest
    role: QA
    systemPrompt: You review teammates' work against the acceptance criteria and say what is wrong.
    allowedTools: [read_file, shell]

# Project-wide tool policy. Most specific pattern wins; a tie goes to the stricter decision, and an
# agent's own `permissions:` block overrides this one. Anything unmatched falls through to "ask".
permissions:
  shell: { "git *": allow, "git commit *": ask, "rm -rf*": deny }
  write_file: { "src/**": allow, "*": ask }

# theme: niti          # TUI palette at launch (ctrl+t opens the picker)
# auto: false          # approve anything not explicitly denied — same as --auto
# maxTurns: 30         # tool-loop cap per agent turn
# verify: [bun run typecheck, bun test]   # checks a changed task must pass before it reports done
#                                         # omitted: detected from the project · false: never verify
# repoMap: true        # generated project outline in every system prompt (false to turn it off)
# maxAgents: 6         # ceiling on team size
# worktree: false      # isolate each run's writes in a throwaway git worktree
# instructions: [AGENTS.md]   # files appended to every agent's system prompt

# lsp:                 # you install the servers; niti spawns them
#   typescript: { command: typescript-language-server, args: [--stdio], extensions: [.ts, .tsx] }

